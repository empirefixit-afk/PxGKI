name: Buildkernel
on:
  workflow_dispatch:
    inputs:
      Android_Release:
        description: "Kernel Android Release"
        required: true
        type: choice
        default: '15'
        options:
           - '14'
           - '15'
      Kernel_Version:
        description: "Kernel Version"
        required: true
        type: choice
        default: '6.6'
        options:
           - '6.1'
           - '6.6'
      Security_Patch:
        description: "(Recommend same as stock kernel)  ㅤㅤㅤKernel Security Patch or lts (latest)"
        required: true
        default: '2025-09'
      Kernel_Suffix:
        description: "(Recommend same as stock kernel)ㅤ‏‎‏‎‏‎‏‎ ㅤ‏‎‏‎‏‎‏‎ ㅤ‏‎‏‎‏‎‏‎ ㅤ‏‎‏‎‏‎‏‎ (Just delete the dirty suffix,fill in [no]) Kernel Suffix"
        required: false
        default: 'g4b48560cd07d-ab14239520-4k'
      Kernel_Time:
        description: "(Recommend same as stock kernel)  ㅤㅤㅤKernel Build Timestamp"
        required: true
        default: 'Thu Oct  9 05:51:31 UTC 2025'
      Enable_KPM_Feature:
        description: "Enable KPM Feature"
        required: false
        default: false
        type: boolean


jobs:
  Details:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          
      - name: Set up repo
        run: |
         curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
         chmod a+x ~/repo
         sudo mv ~/repo /usr/local/bin/repo

      - name: Sync GKI source code
        run: |
         mkdir Buildkernel
         cd Buildkernel
         git config --global user.email "usererror404@gmail.com"
         git config --global user.name "usererror404"
         repo init -u https://android.googlesource.com/kernel/manifest -b common-android${{ github.event.inputs.Android_Release }}-${{ github.event.inputs.Kernel_Version }}-${{ github.event.inputs.Security_Patch }} --depth=1
         repo sync

      - name: Fix 6.6 Build
        if: ${{ github.event.inputs.Kernel_Version == '6.6' }}
        run: |
          cd Buildkernel/common
          FORMATTED_BRANCH="android${{ github.event.inputs.Android_Release }}-${{ github.event.inputs.Kernel_Version }}"
          # Fake Patch to fix failures
          fake_patched=0
          if [ "$FORMATTED_BRANCH" = "android15-6.6" ]; then
            if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
              echo "Can't find nr_subpages try to repair"
              sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' ./fs/proc/task_mmu.c
              fake_patched=1
            fi
          fi

          if [ "$fake_patched" = 1 ]; then
            if [ "$FORMATTED_BRANCH" = "android15-6.6" ]; then
              if grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
                sed -i -e '/unsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;/d' -e '/pagemap_entry_t \*res = NULL;/d' ./fs/proc/task_mmu.c
              fi
            fi
          fi

      - name: Set up SukiSU-Ultra
        run: |
         set -euo pipefail
         cd Buildkernel
         # `builtin` is the only SukiSU branch carrying kernel-side susfs. The old pin
         # (6c13a06) no longer exists upstream -- it was force-pushed away. Use the branch
         # tip, which is where `config KSU_SUSFS` lives (verified: kernel/Kconfig line 37).
         # Keep the Manager APK version aligned with what the kernel reports.
         SUKISU_SRC="builtin"
         SUKISU_VER="v4.3.0-r2"
         curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$SUKISU_SRC"
         git -C KernelSU fetch -q --tags --unshallow origin 2>/dev/null || git -C KernelSU fetch -q --tags origin 2>/dev/null || true
         # setup.sh swallows a failed checkout, so verify HEAD instead of trusting it
         test "$(git -C KernelSU rev-parse HEAD)" = "$(git -C KernelSU rev-parse "$SUKISU_SRC^{commit}")"
         # without this symbol every CONFIG_KSU_SUSFS* below is silently dropped by Kconfig
         grep -qE '^config[[:space:]]+KSU_SUSFS[[:space:]]*$' KernelSU/kernel/Kconfig
         for f in KernelSU/kernel/Kbuild KernelSU/kernel/Makefile; do
           if [ -f "$f" ] && grep -q '^REPO_BRANCH[[:space:]]*:=' "$f"; then
             sed -i "s|^REPO_BRANCH[[:space:]]*:=.*|REPO_BRANCH := $SUKISU_VER|" "$f"; break
           fi
         done
        
      - name: Set up susfs
        run: |
         cd Buildkernel
         git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android${{ github.event.inputs.Android_Release }}-${{ github.event.inputs.Kernel_Version }}
         # No commit pin: the old ee023e3 pin predates 6.1 support entirely and does not
         # contain 50_add_susfs_in_gki-android14-6.1.patch. Use the branch tip.
         test -f "susfs4ksu/kernel_patches/50_add_susfs_in_gki-android${{ github.event.inputs.Android_Release }}-${{ github.event.inputs.Kernel_Version }}.patch"
         cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android${{ github.event.inputs.Android_Release }}-${{ github.event.inputs.Kernel_Version }}.patch ./common/
         cp susfs4ksu/kernel_patches/fs/* ./common/fs/
         cp susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
         cd common
         patch -p1 -F 3 < 50_add_susfs_in_gki-android${{ github.event.inputs.Android_Release }}-${{ github.event.inputs.Kernel_Version }}.patch
           
      - name: Add configuration to kernel
        run: |
         cd Buildkernel
         # susfs
         echo "CONFIG_KSU=y" >> ./common/arch/arm64/configs/gki_defconfig
         echo "CONFIG_KSU_SUSFS=y" >> ./common/arch/arm64/configs/gki_defconfig
         echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> ./common/arch/arm64/configs/gki_defconfig
         echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./common/arch/arm64/configs/gki_defconfig
         echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
         echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./common/arch/arm64/configs/gki_defconfig
         echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./common/arch/arm64/configs/gki_defconfig
         echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./common/arch/arm64/configs/gki_defconfig
         echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./common/arch/arm64/configs/gki_defconfig
         echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./common/arch/arm64/configs/gki_defconfig
         echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./common/arch/arm64/configs/gki_defconfig
         # Previously unset even though the builtin driver defines them: turning on every
         # capability the Kconfig offers instead of the subset the upstream template shipped.
         echo "CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y" >> ./common/arch/arm64/configs/gki_defconfig
         echo "CONFIG_KSU_FEATURE_ADBROOT=y" >> ./common/arch/arm64/configs/gki_defconfig
         # CONFIG_KSU_DEBUG deliberately left OFF: it is extra kernel logging, which is both a
         # detection surface for hiding and a performance cost. The other 14 options are on.
         # tmpfs
         echo "CONFIG_TMPFS_XATTR=y" >> ./common/arch/arm64/configs/gki_defconfig
         echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./common/arch/arm64/configs/gki_defconfig
         sed -i 's/check_defconfig//' ./common/build.config.gki
         # fail loudly if ANY requested KSU symbol was silently dropped by Kconfig -- a dropped
         # SUSFS symbol builds green and ships a kernel that hides nothing, which is the failure
         # this guard exists to catch.
         for c in $(grep -oE '^CONFIG_(KSU|KPM)[A-Z_]*' ./common/arch/arm64/configs/gki_defconfig | sort -u); do
           grep -qE "^config[[:space:]]+${c#CONFIG_}[[:space:]]*$" ./KernelSU/kernel/Kconfig \
             || { echo "::error::$c is not defined by this SukiSU driver"; exit 1; }
         done
         echo "Requested KSU/SUSFS/KPM config count: $(grep -cE '^CONFIG_(KSU|KPM)' ./common/arch/arm64/configs/gki_defconfig)"
         echo -e "\e[33m[Done]\e[0m" Add configuration to kernel
      
      - name: Add KPM configuration to kernel
        if: ${{inputs.Enable_KPM_Feature }}
        run: |
         cd Buildkernel
         echo "CONFIG_KPM=y" >> ./common/arch/arm64/configs/gki_defconfig
         echo -e "\e[33m[Done]\e[0m" Add KPM configuration to kernel
         echo -e "\e[33m[Done]\e[0m" Enable KPM feature

      - name: Patch SukiSU build break (policydb -> pol)
        run: |
         cd Buildkernel
         F=./common/drivers/kernelsu/selinux/rules.c
         if [ ! -f "$F" ]; then echo "::error::$F missing -- SukiSU layout changed"; exit 1; fi
         # SukiSU's `builtin` tip writes `policydb->latest_granting` where the identifier must be
         # `pol`. Two independent proofs that `pol` is correct, both read from this same file:
         #   1. `latest_granting` is a member of `struct selinux_policy`
         #      (linux v6.1 security/selinux/ss/services.h:29), and `pol` is declared
         #      `struct selinux_policy *pol, *old_pol;` at line 154. `db` is `struct policydb *`,
         #      which has no such member -- so writing through `db` cannot compile either.
         #   2. line 619 of the same file performs the identical operation, correctly:
         #         pol->latest_granting = old_pol->latest_granting + 1;
         #   It is the twin of line 194 in the parallel function.
         # Upstream bug, not a config problem. Fix it, and accept the case where upstream has
         # already corrected it so this step does not break on a later pull.
         if grep -qE '^[[:space:]]*policydb->latest_granting' "$F"; then
           # Portable substitution: no capture group (BSD sed rejects it) and no `sed -i`
           # (BSD needs an argument, GNU does not). Keeps the original indentation.
           sed -E 's/policydb->latest_granting/pol->latest_granting/' "$F" > "$F.tmp" && mv "$F.tmp" "$F"
           echo "[fixed] rules.c: policydb -> pol"
         else
           echo "[skip] no bare policydb->latest_granting; upstream already correct"
         fi
         if grep -qE '^[[:space:]]*policydb->' "$F"; then
           echo "::error::a bare policydb-> reference still remains in rules.c"; exit 1
         fi
         # Prove the corrected form is present, so a silent no-op cannot pass as a fix.
         if ! grep -qE '^[[:space:]]*pol->latest_granting[[:space:]]*=' "$F"; then
           echo "::error::expected 'pol->latest_granting =' in rules.c and did not find it"; exit 1
         fi
         echo "[ok] rules.c writes latest_granting through pol"

      - name: Set up kernel suffix
        run: |
         cd Buildkernel
         if [ "${{ github.event.inputs.Kernel_Version }}" = "6.1" ] &&  [ "${{ github.event.inputs.Kernel_Suffix }}" = "no" ]; then
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
          echo -e "\e[33m[Done]\e[0m" Delete the dirty suffix
         fi
         if [ "${{ github.event.inputs.Kernel_Version }}" = "6.6" ] &&  [ "${{ github.event.inputs.Kernel_Suffix }}" = "no" ]; then
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
          sed -i '/^CONFIG_LOCALVERSION=/ s/="\([^"]*\)"/=""/' ./common/arch/arm64/configs/gki_defconfig
          echo -e "\e[33m[Done]\e[0m" Delete the dirty suffix
         fi         
         if [ "${{ github.event.inputs.Kernel_Version }}" = "6.1" ] && [ "${{ github.event.inputs.Kernel_Suffix }}" != "no" ]; then
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
          sed -i '$s|echo "\$res"|echo "$res-${{ github.event.inputs.Kernel_Suffix }}"|' ./common/scripts/setlocalversion
          echo -e "\e[33m[Done]\e[0m" Set up custom suffix
         fi
         if [ "${{ github.event.inputs.Kernel_Version }}" = "6.6" ] && [ "${{ github.event.inputs.Kernel_Suffix }}" != "no" ]; then
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
          sed -i "\$s|echo \"\\\$res\"|echo \"-${{ github.event.inputs.kernel_suffix }}\"|" ./common/scripts/setlocalversion
          sudo sed -i "s/-4k/-${{ github.event.inputs.Kernel_Suffix }}/g" ./common/arch/arm64/configs/gki_defconfig
          echo -e "\e[33m[Done]\e[0m" Set up custom suffix
         fi

      - name: Set up kernel build timestamp
        run: |
         cd Buildkernel
         perl -pi -e "s{UTS_VERSION=\"\\\$\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\)\"}{UTS_VERSION=\"#1 SMP PREEMPT ${{ github.event.inputs.Kernel_Time }}\"}" ./common/scripts/mkcompile_h
         sed -i -e "s|\$(preempt-flag-y) \"\$(build-timestamp)\"|\$(preempt-flag-y) \"${{ github.event.inputs.Kernel_Time }}\"|" ./common/init/Makefile
         echo -e "\e[33m[Done]\e[0m" Set up kernel build timestamp

      - name: Build kernel
        run: |
         cd Buildkernel
         sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
         rm -rf ./common/android/abi_gki_protected_exports_*
         sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64
         sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' common/build.config.gki.aarch64
         sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64
         tools/bazel run --config=fast --lto=none //common:kernel_aarch64_dist -- --destdir=dist
         
      - name: KPM patch
        if: ${{inputs.Enable_KPM_Feature }}
        run: |
         cd Buildkernel/dist
         curl -LO "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux"
         chmod 777 patch_linux
         ./patch_linux
         rm Image
         mv oImage Image
         echo -e "\e[33m[Done]\e[0m" KPM feature is enabled
         
      - name: Output kernel
        run: |
         cd Buildkernel/dist
         cp Image kernel

      - name: Set up AnyKernel3
        run: |
         cd Buildkernel
         git clone https://github.com/SukiSU-Ultra/SukiSU_patch.git

      - name: Create AnyKernel3
        run: |
         cd Buildkernel/SukiSU_patch/AnyKernel3
         cp /home/runner/work/PxGKI/PxGKI/Buildkernel/dist/Image /home/runner/work/PxGKI/PxGKI/Buildkernel/SukiSU_patch/AnyKernel3/
         zip -r "android${{ github.event.inputs.Android_Release }}-${{ github.event.inputs.Kernel_Version }}-AnyKernel3.zip" ./*         

      - name: Output AnyKernel3
        run: |
         cd Buildkernel
         mkdir patched
         cd patched
         cp /home/runner/work/PxGKI/PxGKI/Buildkernel/dist/kernel /home/runner/work/PxGKI/PxGKI/Buildkernel/patched/
         cp /home/runner/work/PxGKI/PxGKI/Buildkernel/SukiSU_patch/AnyKernel3/android${{ github.event.inputs.Android_Release }}-${{ github.event.inputs.Kernel_Version }}-AnyKernel3.zip /home/runner/work/PxGKI/PxGKI/Buildkernel/patched/

      - name: Upload Kernel and AnyKernel3
        uses: actions/upload-artifact@v5
        with:
          name: Kernel&AnyKernel3-android${{ github.event.inputs.Android_Release }}-${{ github.event.inputs.Kernel_Version }}
          path: |
            Buildkernel/patched/kernel
            Buildkernel/patched/*.zip
